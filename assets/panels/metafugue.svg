<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220mm" height="128.5mm" viewBox="0 0 220 128.5">
  <!-- Placeholder MetaFugue panel: light gray background with thin divider
       between the Fugue (left) and FugueX (right) sections. To be replaced
       with the proper artwork. -->
  <rect x="0" y="0" width="220" height="128.5" fill="#f0f0f0"/>
  <!-- Divider line between Fugue half (0-105mm) and FugueX half (105+mm) -->
  <line x1="105" y1="5" x2="105" y2="123.5" stroke="#202030" stroke-width="0.4" stroke-dasharray="1.5,1.5"/>
  <!-- Labels -->
  <text x="50" y="12" text-anchor="middle" font-family="sans-serif" font-size="4" fill="#202030">FUGUE</text>
  <text x="160" y="12" text-anchor="middle" font-family="sans-serif" font-size="4" fill="#202030">FUGUE X</text>
</svg>
