name: Build and release MetaModule plugin

on:
  workflow_dispatch:
    inputs:
      SDK_branch:
        description: 'MetaModule SDK branch'
        required: true
        type: choice
        default: main
        options:
          - main
      do_release:
        description: 'Create Release (must also select Tag above!)'
        required: true
        default: false
        type: boolean

jobs:
  build-lin:
    strategy:
        matrix:
          gcc: ['12.3.Rel1']
    name: "Build plugin on linux"
    runs-on: ubuntu-24.04
    steps:
      - name: Install Arm GNU Toolchain (arm-none-eabi-gcc)
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: ${{ matrix.gcc }}

      - name: Install cmake
        uses: jwlawson/actions-setup-cmake@v1.13
        with:
          cmake-version: '3.26.x'

      - name: Git setup
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build inkscape python3-pil

      - name: Set Release Version
        if: startsWith(github.ref, 'refs/tags/')
        uses: FranzDiebold/github-env-vars-action@v2

      - name: Get the SDK
        run: |
          git clone -b ${{ inputs.SDK_branch }} https://github.com/4ms/metamodule-plugin-sdk --recursive ${{ github.workspace }}/metamodule-plugin-sdk

      - name: Convert SVGs to PNGs
        run: |
          # Convert faceplate panels at 240px height with white background
          for svg in tine meter swell fugue gsx intone overtone phase quadlfo; do
            python3 ${{ github.workspace }}/metamodule-plugin-sdk/scripts/SvgToPng.py \
              --input assets/panels/${svg}.svg \
              --output assets/ \
              --white --height=240
          done
          # Convert slider components at native scale (no --height flag)
          for svg in slider-horiz-bg slider-horiz-handle; do
            python3 ${{ github.workspace }}/metamodule-plugin-sdk/scripts/SvgToPng.py \
              --input assets/panels/${svg}.svg \
              --output assets/ \
              --white
          done
          # Flatten any remaining RGBA to RGB (MetaModule uses RGB565, no alpha)
          python3 -c "
          from PIL import Image
          import glob
          for f in sorted(glob.glob('assets/*.png')):
              img = Image.open(f)
              if img.mode == 'RGBA':
                  bg = Image.new('RGB', img.size, (255, 255, 255))
                  bg.paste(img, mask=img.split()[3])
                  bg.save(f)
                  print(f'Flattened {f}')
          "

      - name: Build
        run: |
          mkdir -p ${{ github.workspace }}/metamodule-plugins
          cmake -B build -G Ninja -DMETAMODULE_SDK_DIR=${{ github.workspace }}/metamodule-plugin-sdk
          cmake --build build
          # CMake now produces both an unversioned file and a -v$VERSION copy
          # for local-deploy convenience; the workflow only wants the
          # workflow-versioned name. Drop the locally-versioned copies first
          # so the rename below produces a single clean file.
          cd ${{ github.workspace }}/metamodule-plugins
          rm -f SignalFunctionSet-v*.mmplugin
          # Tag the remaining unversioned plugin with the workflow ref name
          for f in *.mmplugin; do mv "$f" "${f%.mmplugin}-${{ env.CI_REF_NAME }}.mmplugin"; done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalFunctionSet-mmplugin
          path: metamodule-plugins/*.mmplugin

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') && inputs.do_release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release: ${{ env.CI_REF_NAME }}"
          files: |
            metamodule-plugins/*.mmplugin
